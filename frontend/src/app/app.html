<div class="application-shell">
  <header class="application-header">
    <a class="brand" routerLink="/" aria-label="ShareCutter home">
      <span class="brand__mark">SC</span>

      <span class="brand__text">
        <strong>{{ applicationName }}</strong>
        <small>Portfolio Simulator</small>
      </span>
    </a>

    <nav class="main-navigation" aria-label="Main navigation">
      <a routerLink="/dashboard" routerLinkActive="main-navigation__link--active" class="main-navigation__link">
        Dashboard
      </a>

      <a routerLink="/portfolios" routerLinkActive="main-navigation__link--active" class="main-navigation__link">
        Portfolios
      </a>
    </nav>

    <nav class="account-navigation" aria-label="Account navigation">
      <a routerLink="/login" routerLinkActive="account-navigation__link--active" class="account-navigation__link">
        Log in
      </a>

      <a routerLink="/register" routerLinkActive="account-navigation__link--active" class="account-navigation__button">
        Create account
      </a>
    </nav>
  </header>

  <main class="application-content">
    <router-outlet />
  </main>

  <footer class="application-footer">
    <p>
      {{ applicationName }}
      &middot;
      Portfolio allocation and weekly target management
    </p>
  </footer>
</div>
